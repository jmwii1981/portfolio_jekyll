name: Site quality

on:
  push:
    branches: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check JavaScript syntax
        run: |
          find scripts -type f \( -name '*.mjs' -o -name '*.js' \) ! -path 'scripts/vendor/*' ! -path 'scripts/third-party/*' -print0 | while IFS= read -r -d '' file; do node --check "$file" || exit 1; done
          node scripts/network.test.mjs
      - name: Audit generated HTML
        run: bundle exec ruby scripts/audit-site.rb
