name: Site quality

on:
  push:
    branches: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Verify static search database
        run: bundle exec ruby scripts/build-search-index.rb --check
      - name: Check JavaScript syntax
        run: |
          node --check scripts/initializeScripts.js
          for file in scripts/perspectives/*.mjs; do node --check "$file"; done
          for file in scripts/search/*.mjs; do node --check "$file"; done
          node scripts/search/searchIndex.test.cjs
      - name: Audit generated HTML
        run: bundle exec ruby scripts/audit-site.rb
