<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% assign redirect_target = page.redirect_to | relative_url %}
    <title>Page moved — Jan Michael Wallace II</title>
    <link rel="canonical" href="{{ page.redirect_canonical | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ redirect_target }}">
    <script>window.location.replace({{ redirect_target | jsonify }});</script>
</head>
<body>
    <main>
        <h1>Page moved</h1>
        <p>This page now lives at <a href="{{ redirect_target }}">{{ page.redirect_label }}</a>.</p>
    </main>
</body>
</html>
