<!-- site header / nav container -->
<header class="header">
    <div class="site-identity">
    <a class="a img logo-container large{% if page.url == '/' %} logo-container--home{% else %} logo-container--subpage{% endif %}" href="{{ '/' | relative_url }}" aria-label="Jan Michael Wallace II, home">
        <svg class="logo large" aria-hidden="true" focusable="false" width="158" height="159" viewBox="0 0 158 159" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Opening dots use circle geometry so their shape remains round in every browser. -->
            <circle class="anim-dot anim-dot-1" cx="33" cy="115" r="10.285" fill="var(--color-ink)" opacity="0" />
            <circle class="anim-dot anim-dot-2" cx="64" cy="115" r="10.285" fill="var(--color-ink)" opacity="0" />
            <circle class="anim-dot anim-dot-3" cx="95" cy="115" r="10.285" fill="var(--color-ink)" opacity="0" />
            <circle class="anim-dot anim-dot-4" cx="126" cy="115" r="10.285" fill="var(--color-ink)" opacity="0" />
            <!-- Interior columns -->
            <path class="anim-col-1" d="M33 92L33 125" stroke="var(--color-ink)" stroke-width="20.57" stroke-linecap="round" />
            <path class="anim-col-2" d="M64 33L64 125" stroke="var(--color-ink)" stroke-width="20.57" stroke-linecap="round" />
            <path class="anim-col-3" d="M95 33L95 125" stroke="var(--color-ink)" stroke-width="20.57" stroke-linecap="round" />
            <path class="anim-col-4" d="M126 33L126 125" stroke="var(--color-ink)" stroke-width="20.57" stroke-linecap="round" />
        </svg> 
    </a>
    </div>
    {% include nav.html %}
</header>
