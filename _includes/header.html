<!-- site header / nav container -->
<header class="header" data-liquid-ignore>
    <span class="site-liquid-glass-lens site-liquid-glass-lens--header" data-header-liquid-glass-lens aria-hidden="true"></span>
    <div class="site-identity">
    <a class="a img logo-container large{% if page.url == '/' %} logo-container--home{% else %} logo-container--subpage{% endif %}" href="{{ '/' | relative_url }}" aria-label="Jan Michael Wallace II, home">
        {% include site-logo.svg class="logo large" %}
    </a>
    </div>
    {% include nav.html %}
</header>
