<!-- main navigation container -->
<nav 
    class="nav-container"
    aria-label="Primary">
    <div class="nav-controls">
    <span class="dock-glass" aria-hidden="true"></span>
    <button
        class="nav-toggle dock-control"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open menu">
        <span class="dock-menu-icon" aria-hidden="true"><span class="nav-toggle-line nav-toggle-line--top"></span><span class="nav-toggle-line nav-toggle-line--bottom"></span></span>
        <span class="dock-dot-label" aria-hidden="true">Menu</span>
    </button>
    {% unless page.url == '/' %}
    <div class="dock-home-slot">
        <a class="dock-control dock-home" href="{{ '/' | relative_url }}" aria-label="Home">
            <span class="dock-house-icon" aria-hidden="true"></span>
            <span class="dock-dot-label" aria-hidden="true">Home</span>
        </a>
    </div>
    {% endunless %}
    <div class="dock-top-slot" aria-hidden="true" inert>
        <button class="dock-control dock-top dock-arrow" type="button" aria-label="To the top" tabindex="-1" hidden disabled inert>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg>
            <span class="dock-dot-label" aria-hidden="true">To the top</span>
        </button>
    </div>
    <div class="dock-dots" role="group" aria-label="Page sections"></div>
    <div class="dock-bottom-slot">
        <button class="dock-control dock-bottom dock-arrow" type="button" aria-label="To the bottom">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg>
            <span class="dock-dot-label" aria-hidden="true">To the bottom</span>
        </button>
    </div>
    </div>
    <div class="nav-panel">
    <span class="menu-glass" aria-hidden="true"></span>
    <ul class="nav" id="primary-navigation">
        <li 
            id="about-tab"
            class="tab-container">
                <a 
                id="about-link"
                class="a tab {% if page.url == '/' %}active{% endif %}"
                {% if page.url == '/' %}aria-current="page"{% endif %}
                href="{{ '/' | relative_url }}" aria-label="About"><span class="menu-icon-circle" aria-hidden="true">{% include menu-hand.svg %}</span><span>About</span></a>
        </li>
        <li 
            id="vitae-tab"
            class="tab-container">
                <a 
                id="vitae"
                class="a tab {% if page.url contains '/vitae/' %}active{% endif %}"
                {% if page.url contains '/vitae/' %}aria-current="page"{% endif %}
                href="{{ '/vitae/' | relative_url }}" aria-label="View work"><span class="menu-icon-circle" aria-hidden="true"><img class="menu-emoji" src="{{ '/images/ui/briefcase.svg' | relative_url }}" width="26" height="26" alt="" aria-hidden="true"></span><span>View work</span></a>
        </li>
        <li 
            id="perspectives-tab"
            class="tab-container">
                <a 
                    id="perspectives"
                    class="a tab {% if page.url == '/perspectives/' %}active{% endif %}"
                    {% if page.url == '/perspectives/' %}aria-current="page"{% endif %}
                    href="{{ '/perspectives/' | relative_url }}" aria-label="Perspectives"><span class="menu-icon-circle" aria-hidden="true">{% include menu-thought-bubble.svg %}</span><span>Perspectives</span></a>
        </li>
        <li 
            id="contact-tab"
            class="tab-container">
                <a id="contact"
                   class="a tab {% if page.url == '/contact/' %}active{% endif %}"
                   {% if page.url == '/contact/' %}aria-current="page"{% endif %}
                   href="{{ '/contact/' | relative_url }}" aria-label="Contact me"><span class="menu-icon-circle" aria-hidden="true"><img class="menu-emoji" src="{{ '/images/ui/emoji-envelope.svg' | relative_url }}" width="26" height="26" alt="" aria-hidden="true"></span><span>Contact me</span></a>
        </li>
        <li id="follow-tab" class="tab-container">
            <a id="follow-link" class="a tab" href="https://www.linkedin.com/in/jmwii1981/" target="_blank" rel="noopener noreferrer" aria-label="Follow me on LinkedIn (opens in a new tab)">
                <span class="menu-icon-circle" aria-hidden="true"><span class="menu-emoji menu-linkedin-tile"><svg class="menu-linkedin-letters" viewBox="0 0 24 24" aria-hidden="true"><g class="menu-linkedin-letter menu-linkedin-letter--i"><circle cx="5" cy="5" r="2"/><path d="M3 9h4v12H3z"/></g><path class="menu-linkedin-letter menu-linkedin-letter--n" d="M10 9h3.8v1.64C14.34 9.6 15.64 8.8 17.35 8.8 21 8.8 21 11.2 21 14.32V21h-4v-5.92c0-1.41-.03-3.23-1.97-3.23-1.98 0-2.28 1.54-2.28 3.13V21H9V9z"/></svg></span></span><span>Follow me</span>
            </a>
        </li>
    </ul>
    </div>
</nav>
