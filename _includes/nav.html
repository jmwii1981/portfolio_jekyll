<!-- main navigation container -->
<nav 
    class="nav-container"
    aria-label="Primary">
    <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open menu">
        <span class="nav-toggle-line nav-toggle-line--top" aria-hidden="true"></span>
        <span class="nav-toggle-line nav-toggle-line--bottom" aria-hidden="true"></span>
    </button>
    <span class="nav-indicator" aria-hidden="true"></span>
    <ul class="nav" id="primary-navigation">
        <li 
            id="about-tab"
            class="tab-container">
                <a 
                id="about-link"
                class="a tab {% if page.url == '/' %}active{% endif %}"
                {% if page.url == '/' %}aria-current="page"{% endif %}
                href="{{ '/#about' | relative_url }}">About</a>
        </li>
        <li 
            id="work-tab"
            class="tab-container">
                <a 
                id="work"
                class="a tab {% if page.url == '/work/' %}active{% endif %}"
                {% if page.url == '/work/' %}aria-current="page"{% endif %}
                href="{{ '/work/' | relative_url }}">Work</a>
        </li>
        <li 
            id="perspectives-tab"
            class="tab-container">
                <a 
                    id="perspectives"
                    class="a tab {% if page.url == '/perspectives/' %}active{% endif %}"
                    {% if page.url == '/perspectives/' %}aria-current="page"{% endif %}
                    href="{{ '/perspectives/' | relative_url }}">Perspectives</a>
        </li>
        <li 
            id="contact-tab"
            class="tab-container">
                <a id="contact"
                   class="a tab {% if page.url == '/contact/' %}active{% endif %}"
                   {% if page.url == '/contact/' %}aria-current="page"{% endif %}
                   href="{{ '/contact/' | relative_url }}">Contact Me</a>
        </li>
    </ul>
</nav>
