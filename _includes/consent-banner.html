<section class="consent-banner" data-consent-banner hidden aria-label="Privacy preferences">
    <div class="consent-banner-content">
        <p class="p consent-banner-copy">This site uses local browser storage for inquiry references and optional analytics to understand site activity. You can accept or reject analytics. Essential site features will still work.</p>
        <a class="a consent-banner-link" href="{{ '/terms/' | relative_url }}">Terms Of Use and Privacy Policy</a>
    </div>
    <div class="button-group consent-banner-actions">
        <button class="button consent-button primary" type="button" data-consent-accept><span class="button-label">Accept</span><span class="button-fill"></span></button>
        <button class="button consent-button secondary" type="button" data-consent-reject><span class="button-label">Reject</span><span class="button-fill"></span></button>
    </div>
</section>
