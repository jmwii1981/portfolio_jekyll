<section class="consent-banner" data-consent-banner hidden aria-label="Privacy preferences">
    <div class="consent-banner-content">
        <p class="p consent-banner-copy">This site can save your analytics choice in local browser storage and, if you accept, load analytics to understand site activity. Essential site features will still work if you reject analytics.</p>
        <a class="a consent-banner-link" href="{{ '/terms/' | relative_url }}">Terms of Use and Privacy Policy</a>
    </div>
    <div class="button-group consent-banner-actions">
        <button class="button consent-button secondary" type="button" data-consent-reject><span class="button-label">Reject</span></button>
        <button class="button consent-button primary" type="button" data-consent-accept><span class="button-label">Accept</span></button>
    </div>
</section>
