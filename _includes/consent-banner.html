<section class="consent-banner" data-consent-banner hidden aria-label="Privacy preferences">
    <div class="consent-banner-content">
        <p class="p consent-banner-copy">This site can save your analytics choice in local browser storage and, if you accept, load analytics to understand site activity. Essential site features will still work if you reject analytics.</p>
        <a class="a consent-banner-link" href="{{ '/terms/' | relative_url }}">Terms of Use and Privacy Policy</a>
    </div>
    <div class="button-group consent-banner-actions">
        <button class="button button-container consent-button secondary" type="button" data-consent-reject aria-label="Reject">Reject<span class="button-shadow" aria-hidden="true"></span><span class="button-face-container" aria-hidden="true"><span class="button-face">Reject</span></span></button>
        <button class="button button-container consent-button primary" type="button" data-consent-accept aria-label="Accept">Accept<span class="button-shadow" aria-hidden="true"></span><span class="button-face-container" aria-hidden="true"><span class="button-face">Accept</span></span></button>
    </div>
</section>
